openapi: 3.1.0
info:
  title: Poss POS API
  version: 1.0.0
  description: Versioned REST API foundation. Business operations endpoints are added as their backend modules are implemented.
servers:
  - url: http://localhost:8000/api/v1
paths:
  /health:
    get:
      summary: Check API availability
      operationId: getHealth
      responses:
        '200':
          description: API is available
          content:
            application/json:
              schema:
                type: object
                required: [status, service, version]
                properties:
                  status: { type: string, const: ok }
                  service: { type: string, const: pos-api }
                  version: { type: string, const: v1 }
  /auth/register-business:
    post:
      summary: Create a business and owner account
      operationId: registerBusiness
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [business_name, name, email, password, password_confirmation]
              properties:
                business_name: { type: string, maxLength: 160 }
                name: { type: string, maxLength: 120 }
                email: { type: string, format: email }
                password: { type: string, minLength: 12, format: password }
                password_confirmation: { type: string, format: password }
      responses:
        '201':
          description: Business, owner membership, and API token created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RegistrationResponse'
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/login:
    post:
      summary: Authenticate and issue a personal access token
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
                device_name: { type: string, maxLength: 100 }
      responses:
        '200':
          description: Token and memberships returned
          content:
            application/json:
              schema:
                type: object
                required: [data]
                properties:
                  data:
                    type: object
                    required: [token, user, businesses]
                    properties:
                      token: { type: string }
                      user: { $ref: '#/components/schemas/User' }
                      businesses:
                        type: array
                        items: { $ref: '#/components/schemas/BusinessMembership' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/logout:
    post:
      summary: Revoke the current token
      operationId: logout
      security: [{ bearerAuth: [] }]
      responses:
        '200': { description: Token revoked }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /user:
    get:
      summary: Get the authenticated user
      operationId: getCurrentUser
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Authenticated account
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/User' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
  /business/current:
    get:
      summary: Get the selected business membership
      operationId: getCurrentBusiness
      security: [{ bearerAuth: [] }]
      parameters:
        - in: header
          name: X-Business-ID
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Business and current user's role
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/BusinessMembership' }
        '400': { description: Business context header is missing }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '404': { description: Business is unavailable or user is not a member }
  /products:
    get:
      summary: List products in the selected business
      operationId: listProducts
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - in: query
          name: search
          schema: { type: string, maxLength: 100 }
        - in: query
          name: active
          schema: { type: boolean }
      responses:
        '200':
          description: Paginated business product catalog
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
        '401': { $ref: '#/components/responses/Unauthenticated' }
        '400': { description: Business context header is missing }
        '404': { description: Business is unavailable or user is not a member }
    post:
      summary: Create a product and its empty stock record
      operationId: createProduct
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductInput' }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /products/{product}:
    parameters:
      - $ref: '#/components/parameters/BusinessId'
      - in: path
        name: product
        required: true
        schema: { type: integer }
    get:
      summary: Read a business product
      operationId: getProduct
      security: [{ bearerAuth: [] }]
      responses:
        '200':
          description: Product details and current stock
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { description: Product is unavailable in the selected business }
    put:
      summary: Update a business product
      operationId: updateProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200':
          description: Product updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Product' }
        '404': { description: Product is unavailable in the selected business }
        '422': { $ref: '#/components/responses/ValidationError' }
    patch:
      summary: Partially update a business product
      operationId: patchProduct
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductUpdate' }
      responses:
        '200': { description: Product updated }
        '404': { description: Product is unavailable in the selected business }
        '422': { $ref: '#/components/responses/ValidationError' }
  /inventory:
    get:
      summary: List current stock levels
      operationId: listInventory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: Paginated inventory for the selected business
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/InventoryItem' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
  /inventory/adjustments:
    post:
      summary: Record a stock adjustment
      operationId: adjustInventory
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [product_id, quantity_change, reason]
              properties:
                product_id: { type: integer }
                quantity_change: { type: integer, not: { const: 0 } }
                reason: { type: string, maxLength: 255 }
      responses:
        '201': { description: Stock movement recorded }
        '404': { description: Inventory record not found in the selected business }
        '422': { $ref: '#/components/responses/ValidationError' }
  /inventory/movements:
    get:
      summary: List stock movement history
      operationId: listStockMovements
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: Paginated stock movement ledger
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/StockMovement' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
  /sales:
    get:
      summary: List completed business sales
      operationId: listSales
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      responses:
        '200':
          description: Paginated sales with item snapshots
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items: { $ref: '#/components/schemas/Sale' }
                  meta: { $ref: '#/components/schemas/PaginationMeta' }
    post:
      summary: Complete a cash sale or record a credit sale
      operationId: createSale
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SaleInput' }
      responses:
        '201':
          description: Sale recorded and stock decremented atomically
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '404': { description: Product or stock record is unavailable in the selected business }
        '422': { $ref: '#/components/responses/ValidationError' }
  /sales/{sale}:
    get:
      summary: Read a business sale and its item snapshots
      operationId: getSale
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: '#/components/parameters/BusinessId'
        - in: path
          name: sale
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: Sale details
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { $ref: '#/components/schemas/Sale' }
        '404': { description: Sale is unavailable in the selected business }
components:
  parameters:
    BusinessId:
      in: header
      name: X-Business-ID
      required: true
      schema: { type: string, format: uuid }
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Sanctum
  schemas:
    User:
      type: object
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string, format: email }
    Business:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        currency: { type: string, example: KES }
        timezone: { type: string, example: Africa/Nairobi }
    BusinessMembership:
      allOf:
        - $ref: '#/components/schemas/Business'
        - type: object
          properties:
            role: { type: string, example: owner }
    RegistrationResponse:
      type: object
      required: [data]
      properties:
        data:
          type: object
          required: [token, user, business, role]
          properties:
            token: { type: string }
            user: { $ref: '#/components/schemas/User' }
            business: { $ref: '#/components/schemas/Business' }
            role: { type: string, const: owner }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        last_page: { type: integer }
        total: { type: integer }
    ProductInput:
      type: object
      required: [sku, name, unit_price]
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        category: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 5000 }
        unit_price: { type: string, pattern: '^\\d{1,9}(?:\\.\\d{1,2})?$' }
        cost_price: { type: [string, 'null'], pattern: '^\\d{1,9}(?:\\.\\d{1,2})?$' }
        reorder_level: { type: integer, minimum: 0 }
        is_active: { type: boolean }
    ProductUpdate:
      type: object
      description: All fields are optional for updates.
      properties:
        sku: { type: string, maxLength: 64 }
        name: { type: string, maxLength: 255 }
        category: { type: [string, 'null'], maxLength: 100 }
        description: { type: [string, 'null'], maxLength: 5000 }
        unit_price: { type: string, pattern: '^\\d{1,9}(?:\\.\\d{1,2})?$' }
        cost_price: { type: [string, 'null'], pattern: '^\\d{1,9}(?:\\.\\d{1,2})?$' }
        reorder_level: { type: integer, minimum: 0 }
        is_active: { type: boolean }
    Product:
      allOf:
        - $ref: '#/components/schemas/ProductInput'
        - type: object
          required: [id, quantity_on_hand, is_active]
          properties:
            id: { type: integer }
            quantity_on_hand: { type: integer }
            is_active: { type: boolean }
    InventoryItem:
      type: object
      properties:
        product_id: { type: integer }
        sku: { type: string }
        name: { type: string }
        unit_price: { type: string }
        quantity_on_hand: { type: integer }
        reorder_level: { type: integer }
        is_low_stock: { type: boolean }
    StockMovement:
      type: object
      properties:
        id: { type: integer }
        business_id: { type: string, format: uuid }
        product_id: { type: integer }
        inventory_stock_id: { type: integer }
        sale_id: { type: [integer, 'null'] }
        type: { type: string, enum: [adjustment, sale] }
        quantity_change: { type: integer }
        quantity_before: { type: integer }
        quantity_after: { type: integer }
        reason: { type: [string, 'null'] }
        product:
          type: object
          properties:
            id: { type: integer }
            sku: { type: string }
            name: { type: string }
    SaleInput:
      type: object
      required: [payment_method, items]
      properties:
        payment_method: { type: string, enum: [cash, credit] }
        items:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [product_id, quantity]
            properties:
              product_id: { type: integer }
              quantity: { type: integer, minimum: 1, maximum: 100000 }
    Sale:
      type: object
      properties:
        id: { type: integer }
        receipt_number: { type: string }
        payment_method: { type: string, enum: [cash, credit] }
        status: { type: string, enum: [paid, on_credit] }
        subtotal: { type: string }
        total: { type: string }
        created_at: { type: string, format: date-time }
        items:
          type: array
          items:
            type: object
            properties:
              product_id: { type: integer }
              sku: { type: string }
              product_name: { type: string }
              quantity: { type: integer }
              unit_price: { type: string }
              unit_cost: { type: [string, 'null'] }
              line_total: { type: string }
  responses:
    Unauthenticated:
      description: Authentication token is missing or invalid
    ValidationError:
      description: Request validation failed
      content:
        application/json:
          schema:
            type: object
            properties:
              message: { type: string }
              errors: { type: object }
    TooManyRequests:
      description: Rate limit exceeded
